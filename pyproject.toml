[project]
name = "garmin-local"
version = "0.1.0"
description = "Pull Garmin Connect data into SQLite and expose via MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.20",
    "curl_cffi==0.17.0",
    "mcp==2.3.0",
    "typer==0.9.0",
]

[project.scripts]
garmin-local = "garmin_local.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_local"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["garmin_local"]
