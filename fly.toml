# Fly.io deployment config for garmin-local MCP server
# Deploy: fly deploy
# First-time setup: fly launch (then edit this file)

app = "garmin-local-mcp"
primary_region = "fra"

[build]

[env]
  GARMIN_DB_PATH = "/app/data/garmin.db"
  GARMIN_TOKEN_STORE = "/app/data/.garminconnect"
  GARMIN_SYNC_INTERVAL_HOURS = "24"
  # GARMIN_MCP_TOKEN is set via: fly secrets set GARMIN_MCP_TOKEN=<your-token>
  # Never put the token in this file.

[mounts]
  source = "garmin_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.http_options]
    h2_backend = false

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
